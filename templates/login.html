{% extends "base.html" %}
{% block title %}Login — CineScope{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-glow"></div>

  <div class="auth-card" id="login-card">
    <div class="auth-header">
      <div class="auth-icon">🎬</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your cinematic journey</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="auth-form" id="login-form">

      <div class="form-group">
        <label for="identifier" class="form-label">Username or Email</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-input"
            placeholder="Enter username or email"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full" id="login-submit">
        <span class="btn-text">Sign In</span>
        <span class="btn-icon">→</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>New to CineScope? <a href="{{ url_for('register') }}" class="auth-link" id="go-to-register">Create an account</a></p>
    </div>
  </div>
</section>
{% endblock %}
